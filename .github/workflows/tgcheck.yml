name: tgcheck
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet telethon
      - name: check
        env:
          SESSION: ${{ secrets.NEBULA_STORE_SESSION }}
          API_ID: ${{ secrets.NEBULA_STORE_ID }}
          API_KEY: ${{ secrets.NEBULA_STORE_KEY }}
        run: python3 -u tgcheck.py
