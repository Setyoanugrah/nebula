{
 "name": "seal",
 "on": {
  "workflow_dispatch": {
   "inputs": {
    "key_id": {
     "required": true
    },
    "pubkey": {
     "required": true
    }
   }
  }
 },
 "jobs": {
  "seal": {
   "runs-on": "ubuntu-latest",
   "timeout-minutes": 10,
   "steps": [
    {
     "uses": "actions/checkout@v4"
    },
    {
     "uses": "actions/setup-python@v5",
     "with": {
      "python-version": "3.12"
     }
    },
    {
     "name": "deps",
     "run": "pip install --quiet pynacl"
    },
    {
     "name": "seal",
     "env": {
      "PK": "${{ inputs.pubkey }}",
      "SECRET": "${{ secrets.SEAL_INPUT }}"
     },
     "run": "python3 seal.py"
    }
   ]
  }
 }
}